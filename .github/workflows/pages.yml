# Builds the game and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, pushing is publishing.
#
# The site address is not typed anywhere: GitHub reports it while the job runs
# (github.io or your custom domain) and it is handed to the build, which uses it
# for the link-preview image and the share links. The launch date and the
# analytics provider still come from build/config.json.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one publish at a time; a newer push replaces one still waiting
concurrency:
  group: pages
  cancel-in-progress: false

# Each action is pinned to the exact commit of a release (the version is in the
# comment), so nobody can change what runs here by moving a tag. To update one,
# look up the new release's commit and replace both.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the job only reads the code; keep the token out of the checkout
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # no npm install: the build uses only Node and the files in vendor/
      - name: Build
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: node build/pack.js --site "$SITE"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
